name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# CPU-only CI. No GPU is required: the test suite skips CUDA-dependent paths
# (torch/triton live under the optional `gpu` extra and are not installed here).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

jobs:
  lockfile:
    name: lockfile (uv lock --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Fails if pyproject.toml and uv.lock have drifted. This is the real
      # reproducibility gate referenced by the project docs: the pinned
      # transitive tree must match the declared dependencies.
      - name: Verify lockfile is in sync with pyproject.toml
        run: uv lock --check

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lockfile
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # uv sync --locked installs the *pinned* transitive tree from uv.lock and
      # fails if the lock is stale. Only the CPU-only `test` extra is installed;
      # torch/triton/GPU deps live under the `gpu` extra and are never pulled in.
      - name: Install pinned environment (CPU-only, no GPU deps)
        run: uv sync --locked --no-default-groups --extra test --python ${{ matrix.python-version }}

      - name: Import sanity check
        run: uv run --python ${{ matrix.python-version }} python -c "import protean"

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} python -m pytest -q

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Pinned dev tooling (ruff/mypy/pytest-cov) from the lockfile.
      - name: Install pinned dev tooling
        run: uv sync --locked --no-default-groups --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .
