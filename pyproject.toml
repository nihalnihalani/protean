[project]
name = "protean"
version = "0.1.0"
description = "An RL environment that trains models to write GPU kernels that stay fast on shapes they've never seen."
requires-python = ">=3.11,<3.13"
dependencies = [
    "hud-python[agents]",
    "torch",
    "triton",
    "numpy",
    "pydantic>=2",
]

[project.optional-dependencies]
train = [
    "trl",
    "vllm",
    "peft",
    "datasets",
    "accelerate",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Public env modules only — the hidden grader (tasks/<op>/donotaccess) is baked by Dockerfile.hud as root:700.
only-include = [
    "src/protean/env.py",
    "src/protean/tasks.py",
    "src/protean/task_catalog.py",
    "src/protean/shape_sampler.py",
    "src/protean/splits.py",
    "src/protean/sampler.py",
    "src/protean/manifest.py",
    "src/protean/grader.py",
    "src/protean/scenario_helpers.py",
    "src/protean/tasks",
]

[tool.hatch.build.targets.wheel.sources]
"src/protean" = "protean"
