[project]
name = "protean"
version = "0.1.0"
description = "An RL environment that trains models to write GPU kernels that stay fast on shapes they've never seen."
requires-python = ">=3.11,<3.13"
dependencies = [
]

[project.optional-dependencies]
gpu = [
    "numpy",
    "torch",
    "triton",
]
hud = [
    "hud-python[agents]>=0.6.5",
]
test = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protean"]

[tool.hatch.build.targets.wheel.sources]
"src/protean" = "protean"
