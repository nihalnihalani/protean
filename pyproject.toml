[project]
name = "protean"
version = "0.1.0"
description = "An RL environment that trains models to write GPU kernels that stay fast on shapes they've never seen."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Protean Team" }]
keywords = ["GPU", "RL", "Triton", "kernel-optimization", "reinforcement-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
]

[project.urls]
Homepage = "https://github.com/protean-team/protean"
Repository = "https://github.com/protean-team/protean"
Documentation = "https://github.com/protean-team/protean/tree/main/docs"
Issues = "https://github.com/protean-team/protean/issues"

[project.optional-dependencies]
gpu = [
    "numpy",
    "torch",
    "triton",
]
hud = [
    "hud-python[agents]>=0.6.5",
]
test = [
    "pytest>=7",
    "hypothesis>=6.100",
]
dev = [
    "pytest>=7",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "pip-audit>=2.7",
    "ruff>=0.9",
    "mypy>=1.13",
]
config = [
    "pydantic-settings>=2.5",
]
train = [
    "trl",
    "peft",
    "datasets",
    "accelerate",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protean", "train"]

[tool.hatch.build.targets.wheel.sources]
"src/protean" = "protean"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources",
]

# Ruff configuration lives in the dedicated `ruff.toml` at the repo root.

[tool.coverage.run]
# Measure only the package source. Branch coverage catches untaken branches
# that statement coverage would otherwise score as covered.
source = ["src/protean"]
branch = true
omit = [
    # Grader internals are GPU-only and never exercised in CPU CI.
    "src/protean/tasks/*/donotaccess/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Ratchet floor: set AT OR BELOW the current measured branch coverage (~69%)
# so the baseline build stays green. Raise this as coverage improves; the
# CLI --cov-fail-under flag in CI can tighten independently of this default.
fail_under = 65
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = [
    "triton",
    "triton.*",
    "torch",
    "torch.*",
    "numpy",
    "numpy.*",
    "trl",
    "trl.*",
    "hud",
    "hud.*",
    "peft",
    "peft.*",
    "accelerate",
    "accelerate.*",
    "datasets",
    "datasets.*",
]
ignore_missing_imports = true
