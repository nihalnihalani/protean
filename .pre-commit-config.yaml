# Pre-commit hooks for Protean.
# Install:  uv tool install pre-commit && pre-commit install
# Run all:  pre-commit run --all-files
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        # The frozen task manifest is an intentional committed artifact.
        exclude: ^manifest_v1\.jsonl$

  # Type gate mirrors the CI `typecheck` job. Runs against the local venv
  # (system language) so the [[tool.mypy.overrides]] GPU-stub config applies;
  # an isolated pre-commit env would miss the installed torch/triton overrides.
  # Run `make install-dev` first: it installs the `config` extra so mypy sees
  # the pydantic backend branch (matching CI's `--extra dev --extra config`).
  - repo: local
    hooks:
      - id: mypy
        name: mypy (src/protean, zero errors)
        entry: python -m mypy src/protean
        language: system
        types: [python]
        pass_filenames: false
